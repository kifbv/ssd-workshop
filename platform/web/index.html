<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SSD Workshop: from a one-sentence idea to a live web app, guided by AI. Coming soon." />
    <meta name="color-scheme" content="light dark" />
    <title>SSD Workshop, coming soon</title>
    <style>
      :root {
        --bg: #f7f7f4;
        --fg: #1d1d1b;
        --muted: #55554f;
        --accent: #b4441f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171715;
          --fg: #f2f2ee;
          --muted: #b8b8b0;
          --accent: #f08a5d;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      .mark {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.25rem 0.75rem;
        border: 2px solid var(--accent);
        border-radius: 999px;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.85rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">Coming soon</span>
      <h1>SSD Workshop, coming soon</h1>
      <p>Take a small app idea from one sentence to a live web app, guided by AI, with every step explained.</p>
    </main>
  </body>
</html>
