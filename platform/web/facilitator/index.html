<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Facilitator dashboard · SSD Workshop</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <!-- No inline scripts: the Content-Security-Policy allows scripts from this site only. -->
    <script src="/facilitator/dashboard.js" defer></script>
  </head>
  <body class="dashboard">
    <!-- Ticket 3.11: for facilitators and the admin; a participant sees one line and no data. -->
    <main>
      <header>
        <h1>SSD Workshop</h1>
        <p class="account"><a href="/">My workshop page</a></p>
      </header>

      <noscript><p class="card">This page needs JavaScript. Please turn it on and reload.</p></noscript>

      <p id="dashboard-loading" class="card" role="status">Loading…</p>

      <section id="dashboard-denied" class="card" hidden>
        <p id="dashboard-denied-text"></p>
      </section>

      <section id="dashboard" aria-labelledby="dashboard-heading" hidden>
        <h2 id="dashboard-heading">Facilitator dashboard</h2>
        <p id="dashboard-stopped" class="paused-banner" role="status" hidden></p>

        <!-- Ticket 3.12: the admin only (shown when GET /api/admin/settings answers 200): the caps, and the global Stop. -->
        <section id="admin" class="admin" aria-labelledby="admin-heading" hidden>
          <h3 id="admin-heading">Workshop controls (admin)</h3>

          <div id="admin-stop-box" class="admin-stop">
            <p id="workshop-state" class="workshop-state" role="status" aria-live="polite"></p>
            <button id="stop-button" class="stop" type="button">Stop the workshop</button>
            <div id="stop-confirm" class="stop-confirm" hidden>
              <p id="stop-question"></p>
              <div class="flag-buttons">
                <button id="stop-yes" class="stop" type="button">Yes, stop everything</button>
                <button id="stop-cancel" class="secondary" type="button">Cancel</button>
              </div>
            </div>
            <button id="resume-button" class="resume" type="button" hidden>Resume the workshop</button>
            <p id="message-stop" class="message" role="status" aria-live="polite"></p>
          </div>

          <form id="caps-form" class="caps" novalidate>
            <h4>Caps</h4>
            <div class="cap">
              <label for="cap-aiBudgetUsd">AI budget per person ($)</label>
              <input id="cap-aiBudgetUsd" name="aiBudgetUsd" type="text" inputmode="decimal" autocomplete="off" aria-describedby="cap-aiBudgetUsd-error" />
              <p id="cap-aiBudgetUsd-error" class="field-error" hidden></p>
            </div>
            <div class="cap">
              <label for="cap-changeRequestsPerPerson">Change requests per person</label>
              <input id="cap-changeRequestsPerPerson" name="changeRequestsPerPerson" type="text" inputmode="numeric" autocomplete="off" aria-describedby="cap-changeRequestsPerPerson-error" />
              <p id="cap-changeRequestsPerPerson-error" class="field-error" hidden></p>
            </div>
            <div class="cap">
              <label for="cap-buildsAtOnce">Builds at once</label>
              <input id="cap-buildsAtOnce" name="buildsAtOnce" type="text" inputmode="numeric" autocomplete="off" aria-describedby="cap-buildsAtOnce-error" />
              <p id="cap-buildsAtOnce-error" class="field-error" hidden></p>
            </div>
            <button id="caps-save" type="submit">Save</button>
            <p id="message-caps" class="message" role="status" aria-live="polite"></p>
          </form>
        </section>

        <div class="dashboard-filter">
          <label for="group-filter">Group</label>
          <select id="group-filter"></select>
          <p id="dashboard-count" class="help"></p>
        </div>

        <p id="message-dashboard" class="message" role="status" aria-live="polite"></p>

        <!-- Flagged messages first: one alert each, with Approve and Reject. -->
        <section id="flags" aria-labelledby="flags-heading" hidden>
          <h3 id="flags-heading">Flagged messages</h3>
          <ul id="flag-list" class="flag-list"></ul>
        </section>
        <p id="flags-elsewhere" class="notice" hidden></p>
        <p id="message-flags" class="message" role="status" aria-live="polite"></p>

        <h3 id="rows-heading">Participants</h3>
        <ul id="rows" class="rows" aria-labelledby="rows-heading"></ul>
        <p id="rows-empty" class="help" hidden></p>
      </section>
    </main>
  </body>
</html>
