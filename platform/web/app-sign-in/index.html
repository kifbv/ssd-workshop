<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Save in an app · SSD Workshop</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <!-- No inline scripts: the Content-Security-Policy allows scripts from this site only. -->
    <script src="/app-sign-in/app-sign-in.js" defer></script>
  </head>
  <body class="app-sign-in">
    <!-- Ticket 3.24: the hand-off from the workshop's sign-in to an app (/app-sign-in/?app=<nickname>). -->
    <main>
      <header>
        <h1>SSD Workshop</h1>
        <p class="account"><a href="/">My workshop page</a></p>
      </header>

      <noscript><p class="card">This page needs JavaScript. Please turn it on and reload.</p></noscript>

      <section class="card" aria-labelledby="app-sign-in-heading">
        <h2 id="app-sign-in-heading">Save in an app</h2>
        <p id="app-sign-in-loading" role="status">Loading…</p>
        <div id="app-sign-in-ask" hidden>
          <p id="app-sign-in-question" class="question"></p>
          <p id="app-sign-in-explainer" class="help"></p>
          <button id="continue-button" type="button">Continue</button>
        </div>
        <p id="message-app-sign-in" class="message" role="status" aria-live="polite"></p>
        <p id="app-sign-in-signin" hidden><a id="sign-in-link" class="button-link" href="/">Sign in to the workshop</a></p>
        <p id="app-sign-in-home" hidden><a id="home-link" href="/">Go to my workshop page</a></p>
      </section>
    </main>
  </body>
</html>
