name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Synthesis only: no AWS credentials, no context lookups.
      CDK_DEFAULT_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The browser tests of the sign-in pages (ticket 1.6) need Chromium; the version follows the
      # exact playwright version in platform/package.json.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: CDK synth
        run: npm run synth

      - name: cfn-lint access stack
        run: |
          pip install cfn-lint==1.61.0
          cfn-lint --regions eu-central-1 -- infra/access/access-stack.yaml
