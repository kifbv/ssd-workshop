AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SSD Workshop - least-privilege access. Creates a permissions boundary, four deploy
  policies, a GitHub Actions deploy role (OIDC, kifbv/ssd-workshop main only) and an IAM
  user for Claude's cloud sessions. Writes are limited to ssd-workshop-* names, the
  project=ssd-workshop tag, the /ssd-workshop/ IAM path and DNS under workshop.rankly.games;
  reads that return other projects' secrets or full configuration are not granted.
  Deploy in eu-central-1 as stack name "ssd-workshop-access". The deploy rights cannot
  change this stack, the deploy role, the Claude user or the five managed policies.

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route53 hosted zone id of rankly.games
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["yes", "no"]
    Default: "yes"
    Description: Say "no" if the account already has the token.actions.githubusercontent.com OIDC provider
  GitHubRepo:
    Type: String
    Default: kifbv@7999713/ssd-workshop@1467373954
    Description: >
      Repository part of the OIDC subject, as GitHub sends it (ID form owner@ownerId/repo@repoId,
      seen in CloudTrail AssumeRoleWithWebIdentity events)
  BudgetEmail:
    Type: String
    Description: Address that receives budget alerts
  MonthlyBudgetUsd:
    Type: Number
    Default: 100

Conditions:
  MakeOidc: !Equals [!Ref CreateGitHubOidcProvider, "yes"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # Ceiling for every role the workshop stacks create (Lambda, ECS task, EC2 instance roles).
  BoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ssd-workshop-boundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkshopData
            Effect: Allow
            Action: [dynamodb:*, sqs:*, logs:*, secretsmanager:GetSecretValue, ssm:GetParameter*]
            Resource:
              - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ssd-workshop-*
              - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:ssd-workshop-*
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:ssd-workshop-*
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ssd-workshop-*
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/ssd-workshop-*
              - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ssd-workshop-*
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ssd-workshop/*
          - Sid: WorkshopBuckets
            Effect: Allow
            Action: s3:*
            Resource: arn:aws:s3:::ssd-workshop-*
            Condition:
              StringEquals: {aws:ResourceAccount: !Ref AWS::AccountId}
          - Sid: Bedrock
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
            Resource:
              - arn:aws:bedrock:*::foundation-model/anthropic.*
              - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/eu.anthropic.*
          - Sid: SendCodes
            Effect: Allow
            Action: [ses:SendEmail, ses:SendRawEmail]
            Resource:
              - !Sub arn:aws:ses:*:${AWS::AccountId}:identity/ssd-workshop@rankly.games
              - !Sub arn:aws:ses:*:${AWS::AccountId}:identity/rankly.games
              - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/ssd-workshop-email
            Condition:
              StringEquals: {ses:FromAddress: ssd-workshop@rankly.games}
          # Only the build launcher (ticket 2.9) starts tasks: no task role (participant code) or
          # other workload role can, whatever its own policy says.
          - Sid: RunBuilds
            Effect: Allow
            Action: ecs:RunTask
            Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/ssd-workshop-*:*
            Condition:
              ArnLike: {ecs:cluster: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/ssd-workshop-*"}
              ArnEquals: {aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/ssd-workshop/ssd-workshop-builds-launcher"}
          # RunTask with tags (or propagateTags) is also authorized as TagResource on the new task.
          - Sid: TagBuildsOnStart
            Effect: Allow
            Action: ecs:TagResource
            Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/ssd-workshop-*/*
            Condition:
              StringEquals: {ecs:CreateAction: RunTask}
              ArnEquals: {aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/ssd-workshop/ssd-workshop-builds-launcher"}
          - Sid: WatchBuilds
            Effect: Allow
            Action: [ecs:StopTask, ecs:DescribeTasks]
            Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/ssd-workshop-*/*
          - Sid: PullImages
            Effect: Allow
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/ssd-workshop-*
          - Sid: InvalidateWorkshopSite
            Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: AccountWideServiceCalls
            Effect: Allow
            Action: [ecr:GetAuthorizationToken, xray:PutTraceSegments]
            Resource: "*"
          - Sid: WorkshopMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals: {cloudwatch:namespace: ssd-workshop}
          - Sid: PassWorkshopRoles
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/ssd-workshop/*
            Condition:
              StringEquals: {iam:PassedToService: ecs-tasks.amazonaws.com}
          - Sid: K3sNodeHeartbeat
            Effect: Allow
            Action: ssm:UpdateInstanceInformation
            Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: K3sNodeChannels
            Effect: Allow
            Action: [ssmmessages:*, ec2messages:*, ec2:DescribeInstances, ec2:DescribeTags]
            Resource: "*"
          # ECS network placement (ticket 2.2): ecs:subnet exists on CreateService/UpdateService and
          # CreateExpressGatewayService/UpdateExpressGatewayService; never on RunTask/StartTask.
          # ForAnyValue: an update that leaves the network alone carries no subnet and is not
          # denied. StartTask is never needed.
          - Sid: ServicesInWorkshopSubnetsOnly
            Effect: Deny
            Action: [ecs:CreateService, ecs:UpdateService, ecs:CreateExpressGatewayService, ecs:UpdateExpressGatewayService]
            Resource: "*"
            Condition:
              ForAnyValue:StringNotEquals: {ecs:subnet: [subnet-05229d71b1e0b41ff, subnet-0965bcee41d455dba]}
          - Sid: NoStartTask
            Effect: Deny
            Action: ecs:StartTask
            Resource: "*"
          # Same sharing and egress denies as the deploy policies, except s3:PutBucketNotification,
          # which CDK's bucket notifications handler (a workshop role) needs.
          - Sid: NoExternalSharing
            Effect: Deny
            Action:
              - s3:PutBucketAcl
              - s3:PutObjectAcl
              - s3:PutObjectVersionAcl
              - s3:PutBucketLogging
              - s3:PutInventoryConfiguration
              - s3:PutAnalyticsConfiguration
              - s3:PutReplicationConfiguration
              - secretsmanager:PutResourcePolicy
              - ecr:SetRepositoryPolicy
              - lambda:CreateFunctionUrlConfig
              - lambda:UpdateFunctionUrlConfig
              - lambda:AddLayerVersionPermission
              - sqs:AddPermission
              - sns:AddPermission
              - dynamodb:PutResourcePolicy
              - dynamodb:ExportTableToPointInTime
              - ssm:PutResourcePolicy
              - logs:PutResourcePolicy
              - logs:PutSubscriptionFilter
              - logs:CreateExportTask
            Resource: "*"

  # Deploy rights, part 1: stacks, named resources, IAM, and the denies that guard them.
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ssd-workshop-deploy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkshopStacks
            Effect: Allow
            Action: cloudformation:*
            Resource: !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/ssd-workshop-*/*
          - Sid: ProtectThisStack
            Effect: Deny
            NotAction: ["cloudformation:Describe*", "cloudformation:List*", "cloudformation:Get*"]
            Resource: !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/ssd-workshop-access/*
          - Sid: NoResourceImport
            Effect: Deny
            Action: cloudformation:CreateChangeSet
            Resource: "*"
            Condition:
              "Null": {cloudformation:ImportResourceTypes: "false"}
          - Sid: NamedWorkshopResources
            Effect: Allow
            Action: [dynamodb:*, lambda:*, logs:*, sqs:*, ecr:*, secretsmanager:*, ssm:*, events:*, scheduler:*, states:*, sns:*, ecs:*]
            Resource:
              - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/ssd-workshop-*
              - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:ssd-workshop-*
              - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:ssd-workshop-*
              - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:ssd-workshop-*
              - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/ssd-workshop-*
              - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/ecs/ssd-workshop-*
              - !Sub arn:aws:sqs:*:${AWS::AccountId}:ssd-workshop-*
              - !Sub arn:aws:ecr:*:${AWS::AccountId}:repository/ssd-workshop-*
              - !Sub arn:aws:secretsmanager:*:${AWS::AccountId}:secret:ssd-workshop-*
              - !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/ssd-workshop/*
              - !Sub arn:aws:events:*:${AWS::AccountId}:rule/ssd-workshop-*
              - !Sub arn:aws:scheduler:*:${AWS::AccountId}:schedule/*/ssd-workshop-*
              - !Sub arn:aws:scheduler:*:${AWS::AccountId}:schedule-group/ssd-workshop-*
              - !Sub arn:aws:states:*:${AWS::AccountId}:stateMachine:ssd-workshop-*
              - !Sub arn:aws:sns:*:${AWS::AccountId}:ssd-workshop-*
              - !Sub arn:aws:ecs:*:${AWS::AccountId}:cluster/ssd-workshop-*
              - !Sub arn:aws:ecs:*:${AWS::AccountId}:service/ssd-workshop-*/*
              - !Sub arn:aws:ecs:*:${AWS::AccountId}:task/ssd-workshop-*/*
              - !Sub arn:aws:ecs:*:${AWS::AccountId}:task-definition/ssd-workshop-*:*
          - Sid: WorkshopBuckets
            Effect: Allow
            Action: s3:*
            Resource: arn:aws:s3:::ssd-workshop-*
            Condition:
              StringEquals: {aws:ResourceAccount: !Ref AWS::AccountId}
          - Sid: ActionsWithoutResourceScope
            Effect: Allow
            Action: [ecr:GetAuthorizationToken, ecs:DeregisterTaskDefinition, ecs:DescribeTaskDefinition, logs:CreateLogDelivery, logs:DeleteLogDelivery]
            Resource: "*"
          - Sid: WorkshopEventSourceMappings
            Effect: Allow
            Action: [lambda:CreateEventSourceMapping, lambda:GetEventSourceMapping, lambda:DeleteEventSourceMapping, lambda:UpdateEventSourceMapping]
            Resource: "*"
            Condition:
              ArnLike: {lambda:FunctionArn: !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:ssd-workshop-*"}
          - Sid: TagEventSourceMappings
            Effect: Allow
            Action: lambda:TagResource
            Resource: !Sub arn:aws:lambda:*:${AWS::AccountId}:event-source-mapping:*
          - Sid: WorkshopRolesWithBoundaryOnly
            Effect: Allow
            Action: [iam:CreateRole, iam:PutRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:DeleteRolePolicy]
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/ssd-workshop/*
            Condition:
              StringEquals: {iam:PermissionsBoundary: !Ref BoundaryPolicy}
          - Sid: WorkshopRolesHousekeeping
            Effect: Allow
            Action: [iam:DeleteRole, iam:TagRole, iam:UntagRole, iam:UpdateRole, iam:UpdateAssumeRolePolicy, iam:CreateInstanceProfile, iam:DeleteInstanceProfile, iam:AddRoleToInstanceProfile, iam:RemoveRoleFromInstanceProfile]
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/ssd-workshop/*
              - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/ssd-workshop/*
          - Sid: PassWorkshopRolesToWorkshopServices
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/ssd-workshop/*
            Condition:
              StringEquals:
                iam:PassedToService: [lambda.amazonaws.com, ecs-tasks.amazonaws.com, ec2.amazonaws.com, states.amazonaws.com, scheduler.amazonaws.com, events.amazonaws.com]
          - Sid: ProtectAccessIdentities
            Effect: Deny
            NotAction: ["iam:Get*", "iam:List*"]
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/ssd-workshop-deploy
              - !Sub arn:aws:iam::${AWS::AccountId}:user/ssd-workshop-claude
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/ssd-workshop-boundary
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/ssd-workshop-deploy
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/ssd-workshop-deploy-edge
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/ssd-workshop-deploy-ec2
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/ssd-workshop-deploy-read
          - Sid: WorkshopServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.amazonaws.com/*
            Condition:
              StringEquals: {iam:AWSServiceName: ecs.amazonaws.com}
          - Sid: NoBoundaryEscape
            Effect: Deny
            Action: [iam:DeleteRolePermissionsBoundary, iam:PutRolePermissionsBoundary, iam:CreateUser, iam:CreateAccessKey, iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion]
            Resource: "*"
          - Sid: NoSelfAssume
            Effect: Deny
            Action: [sts:AssumeRole, sts:TagSession, sts:SetSourceIdentity]
            Resource: "*"
          - Sid: TasksOnWorkshopClustersOnly
            Effect: Deny
            Action: ecs:RunTask
            Resource: "*"
            Condition:
              ArnNotLike: {ecs:cluster: !Sub "arn:aws:ecs:*:${AWS::AccountId}:cluster/ssd-workshop-*"}
          # Every action carrying ecs:subnet (see the boundary).
          - Sid: ServicesInWorkshopSubnetsOnly
            Effect: Deny
            Action: [ecs:CreateService, ecs:UpdateService, ecs:CreateExpressGatewayService, ecs:UpdateExpressGatewayService]
            Resource: "*"
            Condition:
              ForAnyValue:StringNotEquals: {ecs:subnet: [subnet-05229d71b1e0b41ff, subnet-0965bcee41d455dba]}
          - Sid: NoStartTask
            Effect: Deny
            Action: ecs:StartTask
            Resource: "*"
          - Sid: RulesOnWorkshopSourcesOnly
            Effect: Deny
            Action: events:PutRule
            Resource: "*"
            Condition:
              ForAnyValue:StringNotLike: {events:source: ssd-workshop.*}
          - Sid: RulesNeedASource
            Effect: Deny
            Action: events:PutRule
            Resource: "*"
            Condition:
              "Null": {events:source: "true"}

  # Deploy rights, part 2: CloudFront, certificates, API Gateway, DNS, Bedrock, SES, and the
  # denies that keep workshop data inside the account (sharing, exports, egress).
  DeployPolicyEdge:
    Type: AWS::IAM::ManagedPolicy
    # W3037: cfn-lint's action list lacks apigateway:TagResource, which AWS checks when
    # CloudFormation creates a tagged API Gateway stage (ApiGatewayTagStagesOnCreate).
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3037]
    Properties:
      ManagedPolicyName: ssd-workshop-deploy-edge
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontTaggedCreate
            Effect: Allow
            Action: cloudfront:CreateDistribution
            Resource: "*"
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
          - Sid: CloudFrontTaggedChange
            Effect: Allow
            Action: [cloudfront:UpdateDistribution, cloudfront:DeleteDistribution, cloudfront:CreateInvalidation, cloudfront:TagResource, cloudfront:UntagResource]
            Resource: "*"
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: TagOnCreateThroughCloudFormation
            Effect: Allow
            Action: [cloudfront:TagResource, acm:AddTagsToCertificate]
            Resource: "*"
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
              "Null": {aws:ResourceTag/project: "true"}
              ForAnyValue:StringEquals: {aws:CalledVia: cloudformation.amazonaws.com}
          - Sid: CloudFrontUntaggableParts
            Effect: Allow
            Action:
              - cloudfront:CreateOriginAccessControl
              - cloudfront:CreateCachePolicy
              - cloudfront:CreateOriginRequestPolicy
              - cloudfront:CreateResponseHeadersPolicy
              - cloudfront:GetOriginAccessControl*
              - cloudfront:Get*Policy*
              - cloudfront:ListOriginAccessControls
              - cloudfront:List*Policies
            Resource: "*"
          - Sid: CloudFrontWorkshopFunctions
            Effect: Allow
            Action: cloudfront:*Function*
            Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:function/ssd-workshop-*
          - Sid: CertificatesTagged
            Effect: Allow
            Action: acm:RequestCertificate
            Resource: "*"
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
              ForAllValues:StringLike:
                acm:DomainNames: [workshop.rankly.games, "*.workshop.rankly.games"]
              "Null": {acm:DomainNames: "false"}
          # CloudFormation requests the certificate without tags and tags it right after
          # (TagOnCreateThroughCloudFormation), so it gets the same names without a request tag.
          - Sid: CertificatesThroughCloudFormation
            Effect: Allow
            Action: [acm:RequestCertificate]
            Resource: "*"
            Condition:
              ForAnyValue:StringEquals: {aws:CalledVia: [cloudformation.amazonaws.com]}
              ForAllValues:StringLike:
                acm:DomainNames: [workshop.rankly.games, "*.workshop.rankly.games"]
              "Null": {acm:DomainNames: "false"}
          - Sid: CertificatesChange
            Effect: Allow
            Action: [acm:DeleteCertificate, acm:UpdateCertificateOptions, acm:AddTagsToCertificate, acm:RemoveTagsFromCertificate]
            Resource: "*"
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: ApiGatewayTaggedCreate
            Effect: Allow
            Action: apigateway:POST
            Resource:
              - !Sub arn:aws:apigateway:${AWS::Region}::/restapis
              - !Sub arn:aws:apigateway:${AWS::Region}::/apis
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
          - Sid: ApiGatewayTaggedChange
            Effect: Allow
            Action: [apigateway:POST, apigateway:PUT, apigateway:PATCH, apigateway:DELETE]
            Resource:
              - !Sub arn:aws:apigateway:${AWS::Region}::/restapis/*
              - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          # CloudFormation's API Gateway v2 handler tags a new API or stage through the tags
          # endpoint (POST/PUT /tags/<url-encoded ARN>), which ApiGatewayTaggedCreate does not
          # cover (live, first ssd-workshop-api deploy). The tags resource has no resource-tag
          # key, so the guard is the call path: only through CloudFormation, whose resource
          # import is denied (NoResourceImport), so only APIs a workshop stack created itself.
          - Sid: ApiGatewayTagOnCreateThroughCloudFormation
            Effect: Allow
            Action: [apigateway:POST, apigateway:PUT]
            Resource: !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
              ForAnyValue:StringEquals: {aws:CalledVia: cloudformation.amazonaws.com}
          # Creating a tagged stage is also authorized as apigateway:TagResource on the API's
          # stages (live, second ssd-workshop-api deploy; the action is not in the Service
          # Authorization Reference yet). The stages inherit the API's tag, so the API must
          # already be the project's.
          - Sid: ApiGatewayTagStagesOnCreate
            Effect: Allow
            Action: apigateway:TagResource
            Resource: !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop, aws:ResourceTag/project: ssd-workshop}
              ForAnyValue:StringEquals: {aws:CalledVia: cloudformation.amazonaws.com}
          - Sid: DnsOnlyWorkshopSubdomain
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
            Condition:
              ForAllValues:StringLike:
                route53:ChangeResourceRecordSetsNormalizedRecordNames: [workshop.rankly.games, "*.workshop.rankly.games"]
              ForAllValues:StringEquals:
                route53:ChangeResourceRecordSetsRecordTypes: [A, AAAA, CNAME]
              "Null":
                route53:ChangeResourceRecordSetsNormalizedRecordNames: "false"
                route53:ChangeResourceRecordSetsRecordTypes: "false"
          - Sid: Bedrock
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
            Resource:
              - arn:aws:bedrock:*::foundation-model/anthropic.*
              - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/eu.anthropic.*
          - Sid: SesForTesting
            Effect: Allow
            Action: [ses:SendEmail, ses:SendRawEmail]
            Resource:
              - !Sub arn:aws:ses:*:${AWS::AccountId}:identity/ssd-workshop@rankly.games
              - !Sub arn:aws:ses:*:${AWS::AccountId}:identity/rankly.games
              - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/ssd-workshop-email
            Condition:
              StringEquals: {ses:FromAddress: ssd-workshop@rankly.games}

          - Sid: NoExternalSharing
            Effect: Deny
            Action:
              - s3:PutBucketAcl
              - s3:PutObjectAcl
              - s3:PutObjectVersionAcl
              - s3:PutBucketLogging
              - s3:PutInventoryConfiguration
              - s3:PutAnalyticsConfiguration
              - s3:PutReplicationConfiguration
              - s3:PutBucketNotification
              - secretsmanager:PutResourcePolicy
              - ecr:SetRepositoryPolicy
              - lambda:CreateFunctionUrlConfig
              - lambda:UpdateFunctionUrlConfig
              - lambda:AddLayerVersionPermission
              - sqs:AddPermission
              - sns:AddPermission
              - dynamodb:PutResourcePolicy
              - dynamodb:ExportTableToPointInTime
              - ssm:PutResourcePolicy
              - logs:PutResourcePolicy
              - logs:PutSubscriptionFilter
              - logs:CreateExportTask
            Resource: "*"
          - Sid: InvokePermissionsForServicesOnly
            Effect: Deny
            Action: lambda:AddPermission
            Resource: "*"
            Condition:
              StringNotEquals:
                lambda:Principal: [apigateway.amazonaws.com, events.amazonaws.com, sns.amazonaws.com, s3.amazonaws.com]
          - Sid: EventTargetsInAccount
            Effect: Deny
            Action: events:PutTargets
            Resource: "*"
            Condition:
              ForAnyValue:ArnNotLike: {events:TargetArn: !Sub "arn:aws:*:*:${AWS::AccountId}:*"}
          - Sid: SubscriptionsInWorkshop
            Effect: Deny
            Action: sns:Subscribe
            Resource: "*"
            Condition:
              StringNotLike:
                sns:Endpoint:
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:ssd-workshop-*
                  - !Sub arn:aws:sqs:*:${AWS::AccountId}:ssd-workshop-*

  # Deploy rights, part 3: EC2 (networks and the advanced track's k3s nodes). A request tag is
  # true for every resource a call names, so each request-tag statement lists only ARN types that
  # are new in every call of its actions; the existing parents a call names (VPC, subnet, security
  # group, route table, Elastic IP, network interface, launch template) need the project tag
  # (Ec2ParentsTagged). Resource types per action: AWS Service Authorization Reference for EC2.
  DeployPolicyEc2:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ssd-workshop-deploy-ec2
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Ec2NewTopLevel
            Effect: Allow
            Action: [ec2:CreateVpc, ec2:CreateInternetGateway, ec2:AllocateAddress, ec2:CreateLaunchTemplate, ec2:CreateVolume, ec2:CreateNetworkInterface]
            Resource:
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:vpc/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:internet-gateway/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:elastic-ip/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:launch-template/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
          - Sid: Ec2NewInVpc
            Effect: Allow
            Action: [ec2:CreateSubnet, ec2:CreateSecurityGroup, ec2:CreateRouteTable]
            Resource:
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:subnet/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:route-table/*
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
          - Sid: Ec2NewAttached
            Effect: Allow
            Action: [ec2:CreateNatGateway, ec2:CreateVpcEndpoint, ec2:RunInstances]
            Resource:
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:natgateway/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:vpc-endpoint/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
            Condition:
              StringEquals: {aws:RequestTag/project: ssd-workshop}
          - Sid: Ec2ParentsTagged
            Effect: Allow
            Action: [ec2:CreateSubnet, ec2:CreateSecurityGroup, ec2:CreateRouteTable, ec2:CreateNatGateway, ec2:CreateVpcEndpoint, ec2:CreateNetworkInterface, ec2:RunInstances]
            Resource:
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:vpc/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:subnet/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:route-table/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:elastic-ip/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
              - !Sub arn:aws:ec2:*:${AWS::AccountId}:launch-template/*
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: Ec2RunInstancesAmazonImages
            Effect: Allow
            Action: ec2:RunInstances
            Resource: arn:aws:ec2:*::image/*
            Condition:
              StringEquals: {ec2:Owner: amazon}
          - Sid: Ec2NoVolumesFromSnapshots
            Effect: Deny
            Action: ec2:CreateVolume
            Resource: arn:aws:ec2:*::snapshot/*
          - Sid: Ec2TagOnCreate
            Effect: Allow
            Action: ec2:CreateTags
            Resource: "*"
            Condition:
              StringEquals: {ec2:CreateAction: [RunInstances, CreateVpc, CreateSubnet, CreateSecurityGroup, CreateInternetGateway, CreateRouteTable, AllocateAddress, CreateLaunchTemplate, CreateVolume, CreateNatGateway, CreateVpcEndpoint, CreateNetworkInterface]}
          - Sid: Ec2ChangeTaggedOnly
            Effect: Allow
            Action:
              - ec2:TerminateInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:ModifyInstanceAttribute
              - ec2:Delete*
              - ec2:Attach*
              - ec2:Detach*
              - ec2:Associate*
              - ec2:Disassociate*
              - ec2:Authorize*
              - ec2:Revoke*
              - ec2:CreateRoute
              - ec2:ReplaceRoute
              - ec2:ModifySubnetAttribute
              - ec2:ModifyVpcAttribute
              - ec2:ModifySecurityGroupRules
              - ec2:CreateLaunchTemplateVersion
              - ec2:ModifyLaunchTemplate
              - ec2:ReleaseAddress
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: "*"
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}

  # Deploy rights, part 4: reads. Account-wide only where the answer holds no secrets and
  # no other project's configuration; everything else is read on workshop names or tags.
  DeployPolicyRead:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ssd-workshop-deploy-read
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadsWithoutSecrets
            Effect: Allow
            Action:
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
              - ec2:Describe*
              - ecs:List*
              - acm:DescribeCertificate
              - acm:ListCertificates
              - acm:ListTagsForCertificate
              - route53:ListHostedZones*
              - route53:GetChange
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
              - servicequotas:Get*
              - servicequotas:List*
              - ses:GetSendQuota
              - ses:GetEmailIdentity
              - ses:ListEmailIdentities
              - s3:ListAllMyBuckets
              - secretsmanager:GetRandomPassword
              - logs:DescribeLogGroups
              - ce:GetCostAndUsage
              - ce:GetCostForecast
            Resource: "*"
          - Sid: WorkshopZoneReads
            Effect: Allow
            Action: [route53:GetHostedZone, route53:ListResourceRecordSets, route53:ListTagsForResource]
            Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
          - Sid: WorkshopIamReads
            Effect: Allow
            Action: [iam:Get*, iam:List*]
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/ssd-workshop/*
              - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/ssd-workshop/*
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/ssd-workshop-*
          # CloudFormation calls GetRole by name before CreateRole. For a role that does not
          # exist yet IAM checks role/<name> without the path, so role/ssd-workshop/* misses it.
          - Sid: WorkshopRoleExistenceCheck
            Effect: Allow
            Action: iam:GetRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/ssd-workshop-*
          - Sid: WorkshopApiReads
            Effect: Allow
            Action: apigateway:GET
            Resource:
              - !Sub arn:aws:apigateway:${AWS::Region}::/restapis/*
              - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: WorkshopDistributionReads
            Effect: Allow
            Action: [cloudfront:GetDistribution*, cloudfront:GetInvalidation, cloudfront:ListInvalidations, cloudfront:ListTagsForResource]
            Resource: "*"
            Condition:
              StringEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: WorkshopBudgetRead
            Effect: Allow
            Action: budgets:ViewBudget
            Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/ssd-workshop-monthly
          - Sid: NoUserDataReads
            Effect: Deny
            Action: [ec2:DescribeInstanceAttribute, ec2:DescribeLaunchTemplateVersions, ec2:DescribeSpotFleetRequests, ec2:DescribeSpotInstanceRequests]
            Resource: "*"
            Condition:
              StringNotEquals: {aws:ResourceTag/project: ssd-workshop}
          - Sid: NoApiKeyReads
            Effect: Deny
            Action: apigateway:GET
            Resource: arn:aws:apigateway:*::/apikeys*
          - Sid: NoVpnKeyReads
            Effect: Deny
            Action: ec2:DescribeVpnConnections
            Resource: "*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ssd-workshop-deploy
      MaxSessionDuration: 3600
      ManagedPolicyArns: [!Ref DeployPolicy, !Ref DeployPolicyEdge, !Ref DeployPolicyEc2, !Ref DeployPolicyRead]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main

  # Claude's cloud sessions use access keys of this user (created by Franck in the console,
  # stored as a network secret). Same rights as the deploy role, nothing more.
  ClaudeUser:
    Type: AWS::IAM::User
    Properties:
      UserName: ssd-workshop-claude
      ManagedPolicyArns: [!Ref DeployPolicy, !Ref DeployPolicyEdge, !Ref DeployPolicyEc2, !Ref DeployPolicyRead]
      Tags: [{Key: project, Value: ssd-workshop}]

  # Workshop emails name this configuration set, so SES does not fall back to the rankly.games
  # identity's default set (rankly-dev, another project's). Created here because the deploy rights
  # cannot create SES resources.
  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: ssd-workshop-email
      Tags: [{Key: project, Value: ssd-workshop}]

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: ssd-workshop-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn}
  BoundaryPolicyArn: {Value: !Ref BoundaryPolicy}
  ClaudeUserName: {Value: !Ref ClaudeUser}
